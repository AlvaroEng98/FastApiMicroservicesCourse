services:
  redis-microservices:
    image: redis:8.2-alpine3.22
    container_name: redis-microservices
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - microservices-networks

  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: redis-ui
    restart: unless-stopped
    ports:
      - "${REDIS_UI_PORT:-8081}:8081"
    environment:
      - REDIS_HOSTS=local:redis-microservices:6379
    depends_on:
      - redis-microservices
    networks:
      - microservices-networks

volumes:
  redis-data:

networks:
  microservices-networks:
    driver: bridge